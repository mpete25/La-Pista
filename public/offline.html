<!doctype html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F1E8" />
  <title>La Pista · Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #F6F1E8; color: #2E2519; font-family: ui-sans-serif, system-ui, sans-serif;
           padding: 24px; box-sizing: border-box; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-family: Georgia, serif; font-size: 24px; margin: 20px 0 8px; }
    p { color: #96866F; font-size: 15px; line-height: 1.5; max-width: 300px; margin: 0 auto 24px; }
    button { background: #7A5C43; color: #FFFDF8; border: 0; border-radius: 999px; padding: 12px 24px;
             font-size: 15px; font-weight: 600; font-family: inherit; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="" />
    <h1>Du er offline</h1>
    <p>Ranglisten og dine kampe hentes live, så La Pista kræver internet. Prøv igen, når du har forbindelse.</p>
    <button onclick="location.reload()">Prøv igen</button>
  </main>
</body>
</html>
